name: Lumo Trading Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests metaapi-cloud-sdk

      - name: Run Trading Bot
        run: python lumo_github_check.py
        env:
          METAPI_TOKEN: ${{ secrets.METAPI_TOKEN }}
          METATRADER_ACCOUNT_ID: ${{ secrets.METATRADER_ACCOUNT_ID }}

      - name: Commit and Push State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add lumo_active_trades.json lumo_balance.json lumo_live_log.txt
          git diff --staged --quiet || git commit -m "🤖 Bot update: State [skip ci]"
          git push
