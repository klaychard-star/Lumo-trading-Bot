on:
  workflow_dispatch:   # <-- THIS gives you Run button!
  repository_dispatch:
    types: [run_lumo_bot]
  schedule:
    - cron: '*/5 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run LUMO Bot
      - run: python lumo_bot.py

      - name: Commit state updates
        run: |
          git config --global user.name "LUMO Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add lumo_active_trades.json lumo_balance.json lumo_live_log.txt
          git commit -m "Auto-update bot state [skip ci]" || echo "No changes to commit"
          git push
